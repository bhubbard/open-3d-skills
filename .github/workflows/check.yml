name: Check skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate skill frontmatter, manifests, and scripts (Node + Rust)
        run: |
          node tests/check.mjs
          cargo test
          cargo run -- verify
      - name: Installer works in a clean home
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME/.claude" "$HOME/.codex"
          bash install.sh
          test -L "$HOME/.claude/skills/threejs-scene" && test -L "$HOME/.codex/skills/frame-capture"
          bash install.sh --uninstall --claude --codex
          test ! -e "$HOME/.claude/skills/threejs-scene"
